project:
  type: default
  render:
    - manuscript.qmd
  output-dir: _output

lang: en
bibliography: references.bib
filters:
  - quarto
  - math-tex.lua
number-sections: true
execute:
  enabled: false
format:
  html:
    toc: true
    embed-resources: true
    html-math-method: plain
    include-in-header: math-header.html
